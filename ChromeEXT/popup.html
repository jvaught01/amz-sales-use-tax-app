<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="v3_2">
      <span class="v3_3"><h2>AMZ TAX TOOL</h2></span
      ><span class="v3_4"
        >California Sales And Use Tax Wizard for Amazon Sellers</span
      ><span class="v4_9">Upload Combined Tax Report</span>
      <div class="v4_13" id="form">
        <form action="/upload" method="post" enctype="multipart/form-data" id="file">
            <input type="file" class="upload-input" name="file" />
        </form>
    </div>
    <button type="submit" class="btn" form="file">
        <span class="v303_6">Give Me My Numbers</span>
    </button>
    <div class="disclaim" id="dataDisplay">
        <div class="content">
          <p>
            Please Note: This tool only calculates 3 main Sales and Use Tax
            fields:
          </p>
          <ul>
            1. Total Sales In California
          </ul>
          <ul>
            2. Total Sales For Period
          </ul>
          <ul>
            3. Total Sales In Other States
          </ul>
        </div>
      </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
