name: Zappa Deploy

on:
  push:
    branches:
      - main
      - dev
      - staging
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install AWS CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y awscli

    - name: Configure AWS Credentials
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}  # Only if using temporary credentials
      run: |
        aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
        aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
        aws configure set region ${{ secrets.AWS_DEFAULT_REGION }}

    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt

    - name: Set Zappa Environment based on branch
      id: set-env
      run: |
        BRANCH_NAME=$(echo "${GITHUB_REF##*/}")
        echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

    - name: Check if already deployed
      id: check-deploy
      run: |
        source venv/bin/activate
        if zappa status $BRANCH_NAME; then
          echo "already_deployed=true" >> $GITHUB_ENV
        else
          echo "already_deployed=false" >> $GITHUB_ENV
        fi

    - name: Deploy or Update with Zappa
      run: |
        source venv/bin/activate
        if [ "$already_deployed" = "true" ]; then
          zappa update $BRANCH_NAME
        else
          zappa deploy $BRANCH_NAME
        fi

    - name: Notify on Success
      if: success()
      run: echo "Deployment was successful for branch $BRANCH_NAME!"

    - name: Notify on Failure
      if: failure()
      run: echo "Deployment failed for branch $BRANCH_NAME!"
